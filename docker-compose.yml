services:
  tazq-db:
    image: postgres:17
    container_name: tazq-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # YALNIZCA YEREL — veritabanı internete AÇILMAZ.
      #
      # Burası "65432:5432" idi. Docker bu biçimi 0.0.0.0'a bağlar, yani PostgreSQL
      # doğrudan internetten erişilebilir hale gelir; dışarıdan bağlantı denemesi
      # gerçekten başarılı oluyordu. Veritabanını koruyan tek şey parola kalmıştı:
      #
      #   · parolaya sınırsız kaba kuvvet denemesi yapılabilir (uygulama katmanındaki
      #     hız sınırları burada devrede DEĞİL),
      #   · PostgreSQL'de çıkacak her uzaktan kod çalıştırma açığı doğrudan istismar
      #     edilebilir hale gelir,
      #   · parola sızarsa (`.env`) tüm veri okunur. Görev içerikleri AES-GCM ile
      #     şifreli ama e-postalar, adlar, parola özetleri, yenileme jetonları ve
      #     tercih JSON'u DÜZ METİN.
      #
      # 127.0.0.1'e bağlanınca port yalnız sunucunun kendisinden erişilebilir olur.
      # Yönetim erişimin kaybolmaz; SSH tüneliyle bağlanırsın:
      #   ssh -i ~/.ssh/tazq_key -L 65432:127.0.0.1:65432 root@178.105.135.252
      - "127.0.0.1:65432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tazqadmin -d tazqdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  tazq-redis:
    image: redis:alpine
    container_name: tazq-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  tazq-backend:
    build:
      context: ./Tazq-Backend
      dockerfile: DockerFile
    container_name: tazq-backend
    env_file:
      - .env
    environment:
      - REDIS_URL=tazq-redis:6379
    expose:
      - "80"
    depends_on:
      tazq-db:
        condition: service_healthy
      tazq-redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: tazq-proxy
    ports:
      - "5200:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tazq-backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
